<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 블록체인 자산 디지털화</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #080808;
      color: #ffffff;
    }

    .login-box {
      width: 90%;
      max-width: 460px;
      margin: 80px auto;
      padding: 40px;
      background: #151515;
      border: 1px solid #d4af37;
      border-radius: 14px;
    }

    h1 {
      color: #d4af37;
      text-align: center;
      margin-bottom: 10px;
    }

    .sub {
      text-align: center;
      color: #cccccc;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      color: #d4af37;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border-radius: 7px;
      border: 1px solid #777;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      background: #d4af37;
      color: #111111;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    .links {
      text-align: center;
      margin-top: 25px;
    }

    .links a {
      color: #d4af37;
      margin: 0 10px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>로그인</h1>

    <div class="sub">
      블록체인 자산 디지털화
    </div>

    <form>
      <label>아이디 또는 이메일</label>
      <input type="text" placeholder="아이디 또는 이메일 입력">

      <label>비밀번호</label>
      <input type="password" placeholder="비밀번호 입력">

      <button type="button">로그인</button>
    </form>

    <div class="links">
      <a href="signup.html">회원가입</a>
      <a href="home.html">홈으로</a>
    </div>
  </div>

</body>
</html>
