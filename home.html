<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 | 블록체인 자산 디지털화</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Malgun Gothic", sans-serif;
    background: #0b0b0b;
    color: #ffffff;
}

header {
    padding: 22px 20px;
    border-bottom: 1px solid #8a6d1d;
    background: #111111;
}

.logo {
    max-width: 1100px;
    margin: auto;
    color: #d4af37;
    font-size: 25px;
    font-weight: bold;
}

.logo a {
    color: #d4af37;
    text-decoration: none;
}

.container {
    width: 92%;
    max-width: 620px;
    margin: 45px auto;
}

.signup-box {
    background: #151515;
    border: 1px solid #8a6d1d;
    border-radius: 16px;
    padding: 35px;
    box-shadow: 0 0 25px rgba(212,175,55,0.10);
}

h1 {
    text-align: center;
    color: #d4af37;
    margin-top: 0;
    margin-bottom: 10px;
}

.description {
    text-align: center;
    color: #cccccc;
    line-height: 1.6;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #e1c45a;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #555555;
    border-radius: 8px;
    background: #202020;
    color: white;
    font-size: 16px;
}

input:focus {
    outline: none;
    border-color: #d4af37;
}

.agree {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 22px 0;
    color: #dddddd;
}

.agree input {
    width: auto;
    transform: scale(1.2);
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 9px;
    background: #d4af37;
    color: #111111;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #f0cf61;
}

.login-link {
    text-align: center;
    margin-top: 22px;
    color: #cccccc;
}

.login-link a {
    color: #d4af37;
    font-weight: bold;
}

.notice {
    margin-top: 25px;
    padding: 15px;
    border-left: 3px solid #d4af37;
    background: #1b1b1b;
    color: #bbbbbb;
    line-height: 1.6;
    font-size: 14px;
}

@media (max-width: 600px) {
    .signup-box {
        padding: 24px 18px;
    }

    .container {
        margin-top: 25px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <a href="index.html">블록체인 자산 디지털화</a>
    </div>
</header>

<div class="container">

    <div class="signup-box">

        <h1>회원가입</h1>

        <p class="description">
            회원 정보를 입력해 주세요.<br>
            가입 후 부동산 정보 등록과 다양한 서비스를 이용할 수 있습니다.
        </p>

        <form id="signupForm">

            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name"
                       placeholder="이름을 입력하세요" required>
            </div>

            <div class="form-group">
                <label for="userid">아이디</label>
                <input type="text" id="userid"
                       placeholder="사용할 아이디를 입력하세요" required>
            </div>

            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email"
                       placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label for="phone">휴대전화</label>
                <input type="tel" id="phone"
                       placeholder="010-0000-0000" required>
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password"
                       placeholder="비밀번호를 입력하세요"
                       minlength="6" required>
            </div>

            <div class="form-group">
                <label for="password2">비밀번호 확인</label>
                <input type="password" id="password2"
                       placeholder="비밀번호를 다시 입력하세요"
                       minlength="6" required>
            </div>

            <div class="form-group">
                <label for="address">주소</label>
                <input type="text" id="address"
                       placeholder="주소를 입력하세요">
            </div>

            <div class="agree">
                <input type="checkbox" id="agree" required>
                <label for="agree">
                    이용약관 및 개인정보 처리방침에 동의합니다.
                </label>
            </div>

            <button type="submit">회원가입 신청</button>

        </form>

        <div class="login-link">
            이미 회원이신가요?
            <a href="index.html">로그인</a>
        </div>

        <div class="notice">
            회원정보는 안전하게 관리되어야 합니다.
            실제 사업용 서비스에서는 회원정보와 비밀번호를
            GitHub 페이지에 직접 저장하지 않고
            별도의 안전한 회원 인증 시스템을 연결합니다.
        </div>

    </div>

</div>

<script>
document.getElementById("signupForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const password =
        document.getElementById("password").value;

    const password2 =
        document.getElementById("password2").value;

    if (password !== password2) {
        alert("비밀번호가 서로 다릅니다. 다시 확인해 주세요.");
        return;
    }

    alert(
        "회원가입 화면 입력이 정상적으로 완료되었습니다.\n" +
        "현재는 홈페이지 제작 단계이므로 실제 회원정보는 저장되지 않습니다."
    );
});
</script>

</body>
</html>
